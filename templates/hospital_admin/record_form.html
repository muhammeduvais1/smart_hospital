{% extends 'base.html' %}

{% block content %}
<div class="card p-4 shadow-sm">
  <h2 class="mb-3">{{ title }}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="mt-3">
      <button class="btn btn-primary">Save</button>
      <a href="{% url 'hospital_admin:records' %}" class="btn btn-secondary ms-2">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
